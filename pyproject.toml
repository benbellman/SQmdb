[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqmdb"
version = "0.1.0"
description = "Polars-first soccer tracking surfaces based on Martens, Dick, and Brefeld (2021)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.25",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sqmdb*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
